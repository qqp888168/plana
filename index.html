<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>共學與你 · 首頁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --rose:#C25668;--rose-deep:#B04458;--rose-lt:#FBF0F2;--rose-md:#EEC4CC;
  --ink:#33252A;--muted:#9A7882;--white:#fff;--border:#F0DEE3;
}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;background:#fff;color:var(--ink);}
a{text-decoration:none;color:inherit;}
img{display:block;max-width:100%;}

/* ── SAVE BAR ── */
.save-bar{
  background:#1E0E14;padding:7px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  flex-wrap:wrap;
}
.save-bar>span{font-size:11.5px;color:rgba(255,255,255,.4);white-space:nowrap;}
.sb-mid{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
.sb-select{
  font-size:12px;padding:4px 8px;border-radius:5px;
  border:1px solid rgba(255,255,255,.2);background:#3A1020;color:#fff;
  font-family:'DM Sans',sans-serif;cursor:pointer;
}
.sb-input{
  flex:1;min-width:0;font-size:12px;padding:4px 10px;border-radius:5px;
  border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);
  color:#fff;font-family:'DM Sans',sans-serif;outline:none;
}
.sb-apply{
  font-size:12px;padding:5px 14px;border-radius:5px;
  background:rgba(255,255,255,.15);color:#fff;border:none;cursor:pointer;
  font-family:'DM Sans',sans-serif;white-space:nowrap;
}
.save-btn{
  font-size:12.5px;font-weight:500;background:var(--rose);color:#fff;
  border:none;border-radius:6px;padding:6px 18px;cursor:pointer;
  font-family:'DM Sans',sans-serif;white-space:nowrap;
}
.save-confirm{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(50px);
  background:#1E0E14;color:#fff;padding:10px 24px;border-radius:8px;
  font-size:13px;font-family:'DM Sans',sans-serif;
  opacity:0;transition:all .3s;z-index:9999;pointer-events:none;
}
.save-confirm.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── NAV ── */
nav{
  background:#fff;padding:0 44px;height:66px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;border-bottom:1px solid #F5E8EC;
}
.nav-logo{display:flex;align-items:center;gap:11px;}
.nav-logo-box{
  width:38px;height:38px;background:var(--rose);border-radius:9px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.nav-logo-box svg{width:20px;height:20px;}
.nav-logo-texts{display:flex;align-items:center;gap:14px;}
.nav-logo-name{font-family:'Noto Serif TC',serif;font-size:18px;font-weight:600;color:var(--rose);}
.nav-logo-sub{font-size:12px;color:var(--muted);}
.nav-center{display:flex;gap:2px;list-style:none;}
.nav-center li a{
  font-size:14px;color:#6E4E58;padding:6px 18px;display:block;
  transition:color .2s;position:relative;
}
.nav-center li a:hover{color:var(--ink);}
.nav-center li.active a{color:var(--rose);font-weight:500;}
.nav-center li.active a::after{
  content:'';position:absolute;bottom:-21px;left:50%;transform:translateX(-50%);
  width:22px;height:2.5px;background:var(--rose);border-radius:2px;
}

/* ── HERO ── */
.hero{
  position:relative;width:100%;overflow:hidden;cursor:pointer;
  line-height:0;
}
.hero-img{width:100%;display:block;max-height:100vh;object-fit:cover;}

/* ── FEATURE THUMBNAILS ── */
.feat-section{background:#fff;padding:24px 32px 40px;}
.feat-grid{
  max-width:100%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}
.feat-card{
  border-radius:16px;overflow:hidden;
  cursor:pointer;position:relative;display:block;
}
.feat-card img{
  width:100%;height:100%;object-fit:cover;display:block;
}

/* ── WHY US ── */
.why-section{background:#fff;padding:64px 16px;}
.why-inner{max-width:1600px;margin:0 auto;}
.section-eyebrow{
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--rose);font-weight:500;margin-bottom:10px;
}
.section-title{
  font-family:'Noto Serif TC',serif;font-size:30px;font-weight:400;
  color:var(--ink);margin-bottom:40px;
}
.why-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:24px;
  align-items:start;
}
.why-card{
  border-radius:18px;overflow:hidden;background:#fff;
  border:1px solid #F2DFE4;
  box-shadow:0 12px 32px rgba(194,86,104,.08);
  line-height:0;
}
.why-card img{width:100%;height:auto;display:block;}

/* ── STATS ── */
.stats-section{background:var(--rose-lt);padding:72px 48px;}
.stats-inner{max-width:960px;margin:0 auto;}
.stats-desc{font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:40px;}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.stat-card{
  background:#fff;border-radius:12px;padding:24px 20px;
  text-align:center;border:1px solid var(--border);
}
.stat-num{
  font-family:'Noto Serif TC',serif;font-size:28px;font-weight:600;
  color:var(--rose);margin-bottom:4px;
}
.stat-label{font-size:12.5px;color:var(--muted);}

/* ── EDITABLE ── */
[contenteditable]{
  outline:none;border-radius:3px;transition:box-shadow .15s;
  cursor:text;
}
[contenteditable]:hover{box-shadow:0 0 0 2px rgba(194,86,104,.22);}
[contenteditable]:focus{box-shadow:0 0 0 2px rgba(194,86,104,.5);background:rgba(194,86,104,.04);}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:28px;left:50%;
  transform:translateX(-50%) translateY(60px);
  background:var(--rose);color:#fff;padding:11px 26px;border-radius:9px;
  font-size:13.5px;font-weight:500;opacity:0;transition:all .3s;
  z-index:9999;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── HAMBURGER ── */
.nav-hamburger{
  display:none;flex-direction:column;justify-content:center;gap:5px;
  width:36px;height:36px;background:none;border:none;cursor:pointer;
  padding:4px;border-radius:7px;transition:background .2s;
}
.nav-hamburger:hover{background:var(--rose-lt);}
.nav-hamburger span{
  display:block;width:22px;height:2px;background:var(--rose);
  border-radius:2px;transition:all .3s;transform-origin:center;
}
.nav-hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
.nav-hamburger.open span:nth-child(2){opacity:0;transform:scaleX(0);}
.nav-hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}

.nav-drawer{
  display:none;position:fixed;top:0;right:0;bottom:0;width:72vw;max-width:280px;
  background:#fff;z-index:200;box-shadow:-4px 0 24px rgba(51,37,42,.12);
  flex-direction:column;padding:80px 28px 40px;gap:4px;
  transform:translateX(100%);transition:transform .3s ease;
}
.nav-drawer.open{transform:translateX(0);}
.nav-drawer li{list-style:none;}
.nav-drawer li a{
  display:block;font-size:16px;color:#6E4E58;padding:12px 4px;
  border-bottom:1px solid var(--border);transition:color .2s;
}
.nav-drawer li a:hover,.nav-drawer li.active a{color:var(--rose);font-weight:500;}
.nav-overlay{
  display:none;position:fixed;inset:0;background:rgba(51,37,42,.35);
  z-index:199;opacity:0;transition:opacity .3s;
}
.nav-overlay.open{opacity:1;}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  nav{padding:0 20px;}
  .nav-center{display:none;}
  .nav-logo-sub{display:none;}
  .nav-hamburger{display:flex;}
  .nav-drawer{display:flex;}
  .nav-overlay{display:block;}
  .feat-section{padding:16px;}
  .why-section{padding:40px 16px;}
  .stats-section{padding:48px 20px;}
  .why-grid{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:600px){
  .save-bar{padding:8px 12px;gap:8px;}
  .sb-mid{flex-wrap:wrap;}
  .feat-grid{grid-template-columns:1fr;}
  .why-grid{grid-template-columns:1fr;}
  .stats-grid{grid-template-columns:repeat(2,1fr);}
  .section-title{font-size:22px;}
}
</style>
</head>
<body>

<!-- SAVE BAR -->
<div class="save-bar" role="toolbar" aria-label="編輯工具列">
  <span>✏️ 點擊文字可編輯</span>
  <div class="sb-mid">
    <select class="sb-select" id="imgTarget" aria-label="選擇要更換的圖片">

    </div>

    </div>

  <ul class="nav-center">

<!-- MOBILE DRAWER -->

<!-- HERO -->
<section class="hero" aria-label="主視覺區塊">

<!-- 為什麼選擇我們 -->

  <div class="why-inner">

      <div class="why-card"><img src="https://qqp888168.github.io/plana/images/013.jpg" alt="彈性學習時程" loading="lazy"></div>

<!-- 累積影響力 -->

  <div class="stats-inner">
    <div class="section-eyebrow" contenteditable="true" aria-label="區塊標籤">累積影響力</div>
    <div class="section-title" id="stats-title" contenteditable="true">每一位學員，都在改變世界</div>
    <div class="stats-desc" contenteditable="true">從 2020 年創立至今，我們共同創造了這些真實的影響。</div>
    <div class="stats-grid">

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// ── 漢堡選單 ──
function toggleDrawer() {
  const hamburger = document.getElementById('hamburger');
  const drawer = document.getElementById('navDrawer');
  const overlay = document.getElementById('navOverlay');
  const isOpen = drawer.classList.contains('open');
  hamburger.classList.toggle('open', !isOpen);
  drawer.classList.toggle('open', !isOpen);
  overlay.classList.toggle('open', !isOpen);
  document.body.style.overflow = isOpen ? '' : 'hidden';
}

// ── 圖片更換 ──
function applyImgUrl() {
  const t = document.getElementById('imgTarget').value;
  const url = document.getElementById('imgUrlInput').value.trim();
  if (!url) { showToast('⚠️ 請先貼上圖片網址'); return; }
  const img = document.getElementById('thumbImg' + parseInt(t));
  if (img) img.src = url;
  document.getElementById('imgUrlInput').value = '';
  showToast('✅ 圖片已套用！記得儲存網頁');
}

// ── Toast ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── blob → base64 ──
async function imgToBase64(url) {
  if (!url || !url.startsWith('blob:')) return url;
  try {
    const res = await fetch(url);
    const blob = await res.blob();
    return await new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(fr.result);
      fr.onerror = () => reject(new Error('FileReader failed'));
      fr.readAsDataURL(blob);
    });
  } catch (e) {
    console.warn('imgToBase64 failed:', e);
    return url;
  }
}

// ── 儲存 HTML ──
async function saveHTML() {
  const btn = document.querySelector('.save-btn');
  btn.textContent = '儲存中...';
  btn.disabled = true;
  try {
    // 把 blob URL 轉 base64
    for (const img of document.querySelectorAll('img[src]')) {
      if (img.src && img.src.startsWith('blob:')) {
        img.src = await imgToBase64(img.src);
      }
    }
    // 暫時移除 contenteditable 以便下載乾淨的 HTML
    const eds = document.querySelectorAll('[contenteditable]');
    eds.forEach(el => el.removeAttribute('contenteditable'));
    const blob = new Blob(
      ['<!DOCTYPE html>\n' + document.documentElement.outerHTML],
      { type: 'text/html;charset=utf-8' }
    );
    eds.forEach(el => el.setAttribute('contenteditable', 'true'));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '共學與你_首頁.html';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    document.getElementById('saveConfirm').classList.add('show');
    setTimeout(() => document.getElementById('saveConfirm').classList.remove('show'), 3000);
  } catch (err) {
    console.error('saveHTML error:', err);
    showToast('❌ 儲存失敗，請再試一次');
  } finally {
    btn.textContent = '⬇ 儲存網頁';
    btn.disabled = false;
  }
}

// ── contenteditable 互動優化 ──
document.querySelectorAll('[contenteditable]').forEach(el => {
  el.addEventListener('click', e => e.stopPropagation());
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
  });
});
</script>
</body>
