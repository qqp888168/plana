<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>共學與你 · 首頁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --rose:#C25668;--rose-deep:#B04458;--rose-lt:#FBF0F2;--rose-md:#EEC4CC;
  --ink:#33252A;--muted:#9A7882;--white:#fff;--border:#F0DEE3;
}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;background:#fff;color:var(--ink);overflow-x:hidden;}
a{text-decoration:none;color:inherit;}
img{display:block;max-width:100%;}

/* ── SAVE BAR ── */
.save-bar{
  background:#1E0E14;padding:7px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  flex-wrap:wrap;position:relative;z-index:200;
}
.save-bar>span{font-size:11.5px;color:rgba(255,255,255,.4);white-space:nowrap;}
.sb-mid{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
.sb-select{font-size:12px;padding:4px 8px;border-radius:5px;border:1px solid rgba(255,255,255,.2);background:#3A1020;color:#fff;font-family:'DM Sans',sans-serif;cursor:pointer;}
.sb-input{flex:1;min-width:0;font-size:12px;padding:4px 10px;border-radius:5px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font-family:'DM Sans',sans-serif;outline:none;}
.sb-apply{font-size:12px;padding:5px 14px;border-radius:5px;background:rgba(255,255,255,.15);color:#fff;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;}
.save-btn{font-size:12.5px;font-weight:500;background:var(--rose);color:#fff;border:none;border-radius:6px;padding:6px 18px;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;}
.save-confirm{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(50px);background:#1E0E14;color:#fff;padding:10px 24px;border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif;opacity:0;transition:all .3s;z-index:9999;pointer-events:none;}
.save-confirm.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── NAV ── */
nav{
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  padding:0 44px;height:66px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;border-bottom:1px solid #F5E8EC;
  transition:box-shadow .4s;
}
nav.scrolled{box-shadow:0 4px 32px rgba(194,86,104,.1);}
.nav-logo{display:flex;align-items:center;gap:11px;}
.nav-logo-box{
  width:38px;height:38px;background:var(--rose);border-radius:9px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:transform .4s cubic-bezier(.34,1.56,.64,1);
}
.nav-logo-box:hover{transform:rotate(-10deg) scale(1.12);}
.nav-logo-box svg{width:20px;height:20px;}
.nav-logo-texts{display:flex;align-items:center;gap:14px;}
.nav-logo-name{font-family:'Noto Serif TC',serif;font-size:18px;font-weight:600;color:var(--rose);}
.nav-logo-sub{font-size:12px;color:var(--muted);}
.nav-center{display:flex;gap:2px;list-style:none;}
.nav-center li a{
  font-size:14px;color:#6E4E58;padding:6px 18px;display:block;
  transition:color .2s;position:relative;overflow:hidden;
}
.nav-center li a::before{
  content:'';position:absolute;bottom:0;left:50%;
  width:0;height:2px;background:var(--rose);border-radius:2px;
  transition:width .3s ease,left .3s ease;
}
.nav-center li a:hover{color:var(--rose);}
.nav-center li a:hover::before{width:60%;left:20%;}
.nav-center li.active a{color:var(--rose);font-weight:500;}
.nav-center li.active a::before{width:60%;left:20%;}

/* ── HERO ── */
.hero{
  position:relative;width:100%;overflow:hidden;
  line-height:0;
}
.hero-img{
  width:100%;display:block;max-height:100vh;object-fit:cover;
  transform:scale(1.06);
  transition:transform 1.6s cubic-bezier(.25,.46,.45,.94);
  will-change:transform;
}
.hero.loaded .hero-img{transform:scale(1);}

/* 視差覆蓋層 */
.hero-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,
    transparent 50%,
    rgba(194,86,104,.06) 80%,
    rgba(251,240,242,.4) 100%);
  pointer-events:none;
}

/* ── 浮動粒子 Canvas ── */
#particles{
  position:absolute;inset:0;
  pointer-events:none;z-index:1;
  opacity:.7;
}

/* ── FEATURE THUMBNAILS ── */
.feat-section{background:#fff;padding:24px 32px 40px;}
.feat-grid{
  max-width:100%;
  display:grid;grid-template-columns:repeat(3,1fr);gap:16px;
}
.feat-card{
  border-radius:16px;overflow:hidden;
  cursor:pointer;position:relative;display:block;
  box-shadow:0 4px 20px rgba(194,86,104,.06);
  transition:transform .5s cubic-bezier(.25,.46,.45,.94),box-shadow .5s ease;
}
/* 光暈效果 */
.feat-card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%),
    rgba(194,86,104,.22) 0%,transparent 65%);
  opacity:0;transition:opacity .3s;z-index:1;border-radius:16px;
  pointer-events:none;
}
.feat-card:hover::before{opacity:1;}
.feat-card::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to top,rgba(194,86,104,.25),transparent 50%);
  opacity:0;transition:opacity .4s;border-radius:16px;
  pointer-events:none;z-index:1;
}
.feat-card:hover{
  transform:translateY(-8px) scale(1.01);
  box-shadow:0 24px 48px rgba(194,86,104,.2);
}
.feat-card:hover::after{opacity:1;}
.feat-card img{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .7s cubic-bezier(.25,.46,.45,.94);
}
.feat-card:hover img{transform:scale(1.08);}

/* ── WHY US ── */
.why-section{background:#fff;padding:64px 16px;}
.why-inner{max-width:1600px;margin:0 auto;}
.section-eyebrow{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--rose);font-weight:500;margin-bottom:10px;
  display:inline-block;
  position:relative;
}
.section-eyebrow::after{
  content:'';position:absolute;bottom:-3px;left:0;
  width:0;height:1px;background:var(--rose);
  transition:width .6s ease .2s;
}
.section-eyebrow.visible::after{width:100%;}
.section-title{
  font-family:'Noto Serif TC',serif;font-size:30px;font-weight:400;
  color:var(--ink);margin-bottom:40px;
}
.why-grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:24px;align-items:start;
}
.why-card{
  border-radius:18px;overflow:hidden;background:#fff;
  border:1px solid #F2DFE4;
  box-shadow:0 12px 32px rgba(194,86,104,.07);
  line-height:0;cursor:pointer;
  transition:transform .5s cubic-bezier(.25,.46,.45,.94),
             box-shadow .5s ease,border-color .3s;
  position:relative;
}
.why-card::after{
  content:'';position:absolute;inset:0;
  box-shadow:inset 0 0 0 2px rgba(194,86,104,0);
  border-radius:18px;transition:box-shadow .3s;pointer-events:none;
}
.why-card:hover{
  transform:translateY(-6px) rotate(.3deg);
  box-shadow:0 24px 56px rgba(194,86,104,.16);
  border-color:var(--rose-md);
}
.why-card:hover::after{box-shadow:inset 0 0 0 2px rgba(194,86,104,.2);}
.why-card img{
  width:100%;height:auto;display:block;
  transition:transform .7s cubic-bezier(.25,.46,.45,.94),filter .4s;
}
.why-card:hover img{transform:scale(1.05);filter:brightness(1.04);}

/* ── STATS ── */
.stats-section{
  background:var(--rose-lt);padding:72px 48px;
  position:relative;overflow:hidden;
}
.stats-section::before{
  content:'';position:absolute;
  width:600px;height:600px;border-radius:50%;
  background:radial-gradient(circle,rgba(194,86,104,.08),transparent 70%);
  top:-200px;right:-200px;pointer-events:none;
}
.stats-inner{max-width:960px;margin:0 auto;position:relative;}
.stats-desc{font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:40px;}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.stat-card{
  background:#fff;border-radius:12px;padding:24px 20px;
  text-align:center;border:1px solid var(--border);
  transition:transform .4s cubic-bezier(.34,1.56,.64,1),box-shadow .4s;
  cursor:default;
}
.stat-card:hover{
  transform:translateY(-6px) scale(1.03);
  box-shadow:0 16px 40px rgba(194,86,104,.14);
}
.stat-num{
  font-family:'Noto Serif TC',serif;font-size:28px;font-weight:600;
  color:var(--rose);margin-bottom:4px;
  display:block;
}
.stat-label{font-size:12.5px;color:var(--muted);}

/* ── SCROLL REVEAL ── */
.reveal{
  opacity:0;transform:translateY(36px);
  transition:opacity .75s cubic-bezier(.25,.46,.45,.94),
             transform .75s cubic-bezier(.25,.46,.45,.94);
}
.reveal.visible{opacity:1;transform:translateY(0);}
.reveal-left{opacity:0;transform:translateX(-32px);transition:opacity .75s ease,transform .75s ease;}
.reveal-left.visible{opacity:1;transform:translateX(0);}
.d1{transition-delay:.08s;}.d2{transition-delay:.16s;}.d3{transition-delay:.24s;}
.d4{transition-delay:.32s;}.d5{transition-delay:.40s;}.d6{transition-delay:.48s;}

/* ── EDITABLE ── */
[contenteditable]{outline:none;border-radius:3px;transition:box-shadow .15s;cursor:text;}
[contenteditable]:hover{box-shadow:0 0 0 2px rgba(194,86,104,.22);}
[contenteditable]:focus{box-shadow:0 0 0 2px rgba(194,86,104,.5);background:rgba(194,86,104,.04);}

/* ── TOAST ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--rose);color:#fff;padding:11px 26px;border-radius:9px;font-size:13.5px;font-weight:500;opacity:0;transition:all .3s;z-index:9999;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── CURSOR GLOW ── */
.cursor-glow{
  position:fixed;width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,rgba(194,86,104,.07),transparent 70%);
  pointer-events:none;z-index:0;
  transform:translate(-50%,-50%);
  transition:transform .08s linear;
  will-change:transform;
}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  nav{padding:0 20px;}
  .nav-center{display:none;}
  .nav-logo-sub{display:none;}
  .feat-section{padding:16px;}
  .why-section{padding:40px 16px;}
  .stats-section{padding:48px 20px;}
  .why-grid{grid-template-columns:repeat(2,1fr);}
  .cursor-glow{display:none;}
}
@media(max-width:600px){
  .save-bar{padding:8px 12px;gap:8px;}
  .sb-mid{flex-wrap:wrap;}
  .feat-grid{grid-template-columns:1fr;}
  .why-grid{grid-template-columns:1fr;}
  .stats-grid{grid-template-columns:repeat(2,1fr);}
  .section-title{font-size:22px;}
}
</style>
</head>

<!-- SAVE BAR -->

<script>
/* ── 滑鼠光暈 ── */
const glow = document.getElementById('cursorGlow');
document.addEventListener('mousemove', e => {
  glow.style.left = e.clientX + 'px';
  glow.style.top  = e.clientY + 'px';
}, { passive: true });

/* ── Nav 滾動 ── */
const nav = document.querySelector('nav');
window.addEventListener('scroll', () => {
  nav.classList.toggle('scrolled', window.scrollY > 10);
}, { passive: true });

/* ── Hero 載入動畫 ── */
const heroImg = document.getElementById('heroBgImg');
const heroSection = heroImg.closest('.hero');
if (heroImg.complete) heroSection.classList.add('loaded');
else heroImg.addEventListener('load', () => heroSection.classList.add('loaded'));

/* ── 視差滾動 ── */
window.addEventListener('scroll', () => {
  const scrolled = window.scrollY;
  heroImg.style.transform = `scale(1) translateY(${scrolled * 0.25}px)`;
}, { passive: true });

/* ── 粒子動畫 ── */
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let particles = [];

function resizeCanvas() {
  canvas.width  = heroSection.offsetWidth;
  canvas.height = heroSection.offsetHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x  = Math.random() * canvas.width;
    this.y  = Math.random() * canvas.height;
    this.r  = Math.random() * 3 + 1;
    this.vx = (Math.random() - .5) * .4;
    this.vy = (Math.random() - .5) * .4 - .2;
    this.alpha = Math.random() * .5 + .15;
    this.life  = 0;
    this.maxLife = Math.random() * 200 + 100;
  }
  draw() {
    const progress = this.life / this.maxLife;
    const a = this.alpha * Math.sin(progress * Math.PI);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(194,86,104,${a})`;
    ctx.fill();
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.life++;
    if (this.life >= this.maxLife) this.reset();
  }
}

for (let i = 0; i < 40; i++) particles.push(new Particle());

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(animateParticles);
}
animateParticles();

/* ── 卡片光暈跟隨滑鼠 ── */
document.querySelectorAll('.feat-card').forEach(card => {
  card.addEventListener('mousemove', e => {
    const rect = card.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width * 100).toFixed(1);
    const y = ((e.clientY - rect.top) / rect.height * 100).toFixed(1);
    card.style.setProperty('--mx', x + '%');
    card.style.setProperty('--my', y + '%');
  });
});

/* ── Scroll Reveal ── */
const revealObserver = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
      revealObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.1 });
document.querySelectorAll('.reveal, .reveal-left').forEach(el => revealObserver.observe(el));

/* ── 數字計數動畫 ── */
function animateCount(el, target) {
  const duration = 1600;
  const start = performance.now();
  function step(now) {
    const progress = Math.min((now - start) / duration, 1);
    const ease = 1 - Math.pow(1 - progress, 3);
    const val = Math.round(ease * target);
    el.textContent = val.toLocaleString('zh-TW');
    if (progress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

const countObserver = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const el = entry.target;
      const target = parseInt(el.dataset.target);
      if (target) animateCount(el, target);
      countObserver.unobserve(el);
    }
  });
}, { threshold: 0.5 });
document.querySelectorAll('.stat-num[data-target]').forEach(el => countObserver.observe(el));

/* ── 圖片更換 ── */
function applyImgUrl() {
  const t = document.getElementById('imgTarget').value;
  const url = document.getElementById('imgUrlInput').value.trim();
  if (!url) { showToast('⚠️ 請先貼上圖片網址'); return; }
  const img = document.getElementById('thumbImg' + parseInt(t));
  if (img) img.src = url;
  document.getElementById('imgUrlInput').value = '';
  showToast('✅ 圖片已套用！記得儲存網頁');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function imgToBase64(url) {
  if (!url || !url.startsWith('blob:')) return url;
  try {
    const res = await fetch(url);
    const blob = await res.blob();
    return await new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(fr.result);
      fr.onerror = () => reject(new Error('FileReader failed'));
      fr.readAsDataURL(blob);
    });
  } catch (e) { return url; }
}

async function saveHTML() {
  const btn = document.querySelector('.save-btn');
  btn.textContent = '儲存中...'; btn.disabled = true;
  try {
    for (const img of document.querySelectorAll('img[src]')) {
      if (img.src && img.src.startsWith('blob:')) img.src = await imgToBase64(img.src);
    }
    const eds = document.querySelectorAll('[contenteditable]');
    eds.forEach(el => el.removeAttribute('contenteditable'));
    const blob = new Blob(['<!DOCTYPE html>\n' + document.documentElement.outerHTML], { type: 'text/html;charset=utf-8' });
    eds.forEach(el => el.setAttribute('contenteditable', 'true'));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '共學與你_首頁.html';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    document.getElementById('saveConfirm').classList.add('show');
    setTimeout(() => document.getElementById('saveConfirm').classList.remove('show'), 3000);
  } catch (err) {
    showToast('❌ 儲存失敗，請再試一次');
  } finally {
    btn.textContent = '⬇ 儲存網頁'; btn.disabled = false;
  }
}

document.querySelectorAll('[contenteditable]').forEach(el => {
  el.addEventListener('click', e => e.stopPropagation());
  el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } });
});
</script>
